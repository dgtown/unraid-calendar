; Calendar viewer for the ESP32-2432S028R "Cheap Yellow Display".
; Build:  pio run            (or pio run -e cyd2usb for the two-USB-port board)
; Flash:  pio run -t upload  (or flash .pio/build/<env>/calendar-display-factory.bin at 0x0)

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    bblanchon/ArduinoJson@7.2.1
    tzapu/WiFiManager@2.0.17
extra_scripts = post:merge_bin.py
build_flags =
    -DUSER_SETUP_LOADED=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DUSE_HSPI_PORT=1
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_GFXFF=1

; The common board: one micro-USB port, ILI9341 panel.
[env:cyd]
build_flags =
    ${env.build_flags}
    -DILI9341_2_DRIVER=1

; Newer board with both micro-USB and USB-C ports, ST7789 panel.
[env:cyd2usb]
build_flags =
    ${env.build_flags}
    -DST7789_DRIVER=1
