services:
  calendar:
    image: ghcr.io/dgtown/unraid-calendar:latest
    # Or build it yourself from this folder:
    # build: .
    container_name: calendar
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /mnt/user/appdata/calendar:/data
    environment:
      TZ: America/New_York            # your time zone
      APP_PASSWORD: ""                # optional password for the web page
      FEED_TOKEN: ""                  # long random string, enables /calendar.ics for phones
      VOIPMS_API_USER: ""             # your voip.ms login email
      VOIPMS_API_PASSWORD: ""         # the API password (not your login password)
      VOIPMS_DID: ""                  # the voip.ms number that receives texts, e.g. 5551234567
      ALLOWED_NUMBERS: ""             # who may text it, comma separated, e.g. 5559876543
      VOIPMS_POLL_SECONDS: "30"
